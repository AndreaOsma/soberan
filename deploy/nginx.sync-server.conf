# Reverse proxy for Soberan sync server (uvicorn on 127.0.0.1:8787).
# TLS: terminate here (certbot) or at Traefik/Caddy in front.
#
# Install (Debian/Ubuntu example):
#   sudo cp deploy/nginx.sync-server.conf /etc/nginx/sites-available/soberan-sync
#   sudo ln -s /etc/nginx/sites-available/soberan-sync /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream soberan_sync {
    server 127.0.0.1:8787;
    keepalive 8;
}

server {
    listen 80;
    server_name sync.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sync.example.com;

    # certbot --nginx -d sync.example.com
    ssl_certificate     /etc/letsencrypt/live/sync.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.example.com/privkey.pem;

    client_max_body_size 64m;

    location /sync/server/ {
        proxy_pass http://soberan_sync;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        return 404;
    }
}
