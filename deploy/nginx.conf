server {
    listen 80;
    server_name _;

    # No revelar la versión de nginx en la cabecera Server (endurecimiento;
    # lo pilla ZAP como "Server Leaks Version Information").
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad (defensa en profundidad; la app va detrás de
    # Authelia y solo por tailnet). nginx NO fusiona add_header entre niveles:
    # una location con su propio add_header descarta las del nivel server, así
    # que se repiten en cada location que produce respuesta en vez de ponerlas
    # una sola vez arriba. La CSP es estricta (script-src 'self') — verificado
    # que el bundle no usa eval/new Function/WASM/workers, ni CSS/fuentes/APIs
    # externas, solo mismo-origen; 'unsafe-inline' queda solo para estilos
    # (atributos style de React). Si algún flujo del SPA fallara (gráficas,
    # export), la línea Content-Security-Policy es el primer sospechoso y se
    # quita sin tocar nada más.

    # Hashed assets (JS/CSS from Vite): cache agresivo OK
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors ${FRAME_ANCESTORS}" always;
    }

    # index.html: nunca cachear — siempre revalidar para recoger nuevas versiones
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors ${FRAME_ANCESTORS}" always;
        try_files $uri =404;
    }

    # Si una petición /api llega hasta aquí, es que el router de Traefik hacia el
    # backend no está sano — mejor un 404 explícito que servir el SPA con 200 y
    # que el cliente crea que recibió JSON válido.
    location /api {
        return 404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors ${FRAME_ANCESTORS}" always;
        try_files $uri /index.html;
    }
}
