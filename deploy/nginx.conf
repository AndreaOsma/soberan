server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets (JS/CSS from Vite): cache agresivo OK
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html: nunca cachear — siempre revalidar para recoger nuevas versiones
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Si una petición /api llega hasta aquí, es que el router de Traefik hacia el
    # backend no está sano — mejor un 404 explícito que servir el SPA con 200 y
    # que el cliente crea que recibió JSON válido.
    location /api {
        return 404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri /index.html;
    }
}
